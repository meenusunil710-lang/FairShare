<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Signup - FairShare</title>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --bg:#12111f; --bg2:#1a1929; --panel:#1e1d30; --panel2:#252340;
      --coral:#e07055; --teal:#4ec9b0; --amber:#e8c547; --sky:#74a9e8;
      --rose:#d45f7a; --mint:#6bbf8e;
      --white:#e8e6f0; --dim:#3d3b56; --dim2:#5a587a;
      --text:#c8c6dc; --text2:#908eaa;
      --shadow:4px 4px 0 #0a0916; --shadow-s:2px 2px 0 #0a0916;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Press Start 2P', monospace; font-size: 12px;
      background: var(--bg); color: var(--text);
      min-height: 100vh; display: flex; justify-content: center; align-items: center;
      overflow-x: hidden;
      background-image: linear-gradient(rgba(255,255,255,0.02) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px);
      background-size: 8px 8px;
    }

    @keyframes fadeSlideUp {
      from { opacity: 0; transform: translateY(14px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes pixelFloat {
      0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4px); }
    }

    .star { position: fixed; font-size: 10px; color: var(--dim2); pointer-events: none; animation: pixelFloat var(--d, 3s) ease-in-out infinite; animation-delay: var(--delay, 0s); }

    .main-content { display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 2rem; width: 100%; }

    .px-panel {
      background: var(--panel); padding: 2.6rem 2.2rem;
      width: 100%; max-width: 460px;
      border: 2px solid var(--dim); box-shadow: var(--shadow);
      animation: fadeSlideUp 0.35s ease-out; position: relative;
    }
    .px-panel::before {
      content: ''; position: absolute; top: 0; left: 0; right: 0;
      height: 4px; background: var(--teal);
    }

    .page-title { font-size: 16px; text-align: center; margin-bottom: 1.8rem; color: var(--white); }
    .page-title span { color: var(--teal); }

    .form-group { margin-bottom: 1.3rem; }
    .form-label { display: block; font-size: 9px; letter-spacing: 1px; margin-bottom: 0.5rem; color: var(--dim2); text-transform: uppercase; }

    .px-input {
      width: 100%; padding: 10px 12px;
      background: var(--bg2); border: 2px solid var(--dim);
      color: var(--text); font-family: 'Press Start 2P', monospace;
      font-size: 10px; outline: none; box-shadow: var(--shadow-s);
    }
    .px-input:focus { border-color: var(--teal); }
    .px-input::placeholder { color: var(--dim2); }

    .strength-meter { height: 9px; background: var(--bg2); border: 1px solid var(--dim); margin-top: 0.5rem; overflow: hidden; }
    .strength-fill { height: 100%; width: 0%; background: var(--rose); transition: width 0.15s step-end, background 0.15s step-end; }
    .strength-label { font-size: 8px; color: var(--dim2); margin-top: 0.4rem; text-align: right; }

    .px-btn {
      display: block; width: 100%;
      font-family: 'Press Start 2P', monospace; font-size: 11px;
      letter-spacing: 0.04em; padding: 12px 16px;
      border: 2px solid var(--white); cursor: pointer;
      text-transform: uppercase; text-align: center;
      margin-top: 1.4rem; box-shadow: var(--shadow);
    }
    .px-btn:hover  { transform: translate(2px,2px); box-shadow: var(--shadow-s); }
    .px-btn:active { transform: translate(4px,4px); box-shadow: none; }
    .btn-teal { background: var(--teal); color: var(--bg); }

    .auth-link { display: block; text-align: center; margin-top: 1.3rem; font-size: 9px; color: var(--sky); text-decoration: none; line-height: 2; }
    .auth-link:hover { color: var(--coral); }

    .flash-container { margin-bottom: 1.1rem; }
    .flash-msg { background: var(--panel2); border: 2px solid var(--dim); padding: 0.8rem 1rem; margin-bottom: 0.4rem; font-size: 9px; line-height: 2; }
    .flash-error   { border-color: var(--rose); color: var(--rose); }
    .flash-success { border-color: var(--mint); color: var(--mint); }
  </style>
</head>
<body>
  <div class="star" style="top:10%;left:6%;--d:3s;--delay:0s;">♦</div>
  <div class="star" style="top:22%;right:8%;--d:2.6s;--delay:0.8s;">★</div>
  <div class="star" style="bottom:15%;left:12%;--d:3.4s;--delay:0.4s;">●</div>
  <div class="star" style="bottom:28%;right:9%;--d:2.9s;--delay:1.2s;">◆</div>

  <div class="main-content">
    <div class="px-panel">
      <h1 class="page-title">FAIR<span>SHARE</span></h1>

      {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
          <div class="flash-container">{% for category, message in messages %}<div class="flash-msg flash-{{ category }}">{{ message }}</div>{% endfor %}</div>
        {% endif %}
      {% endwith %}

      <form action="{{ url_for('signup') }}" method="POST">
        <div class="form-group">
          <label class="form-label" for="name">Name</label>
          <input type="text" id="name" name="name" class="px-input" placeholder="Your name" required>
        </div>
        <div class="form-group">
          <label class="form-label" for="email">Email</label>
          <input type="email" id="email" name="email" class="px-input" placeholder="your@email.com" required>
        </div>
        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <input type="password" id="password" name="password" class="px-input" placeholder="••••••••" required>
          <div class="strength-meter"><div class="strength-fill" id="sf"></div></div>
          <div class="strength-label" id="slabel">strength</div>
        </div>
        <button type="submit" class="px-btn btn-teal">Create</button>
      </form>

      <a href="{{ url_for('login') }}" class="auth-link">← Login Instead</a>
    </div>
  </div>

  <script>
    const pi = document.getElementById('password');
    const sf = document.getElementById('sf');
    const sl = document.getElementById('slabel');
    const labels = ['', 'weak', 'okay', 'good', 'strong!'];
    const colors = ['#d45f7a','#d45f7a','#e8c547','#74a9e8','#6bbf8e'];
    pi.addEventListener('input', () => {
      const v = pi.value;
      let s = 0;
      if (v.length >= 8) s++;
      if (/[A-Z]/.test(v)) s++;
      if (/[0-9]/.test(v)) s++;
      if (/[^A-Za-z0-9]/.test(v)) s++;
      sf.style.width = (s * 25) + '%';
      sf.style.background = colors[s] || '#d45f7a';
      sl.textContent = labels[s] || 'strength';
      sl.style.color = colors[s] || '#5a587a';
    });
  </script>
</body>
</html>
