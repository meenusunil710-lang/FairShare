<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Project | FairShare</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet"/>
    <style>
        :root {
            --bg:#12111f; --bg2:#1a1929; --panel:#1e1d30; --panel2:#252340;
            --coral:#e07055; --teal:#4ec9b0; --amber:#e8c547; --sky:#74a9e8;
            --rose:#d45f7a; --mint:#6bbf8e;
            --white:#e8e6f0; --dim:#3d3b56; --dim2:#5a587a;
            --text:#c8c6dc; --text2:#908eaa;
            --shadow:4px 4px 0 #0a0916; --shadow-s:2px 2px 0 #0a0916;
        }
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Press Start 2P', monospace; font-size: 12px;
            background: var(--bg); color: var(--text); overflow-x: hidden;
            background-image: linear-gradient(rgba(255,255,255,0.02) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px);
            background-size: 8px 8px;
        }
        @keyframes fadeSlideUp { from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:translateY(0)} }
        @keyframes pixelFloat { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-3px)} }

        .layout { display: flex; min-height: 100vh; }
        .sidebar { width:250px; background:var(--panel); position:fixed; height:100vh; display:flex; flex-direction:column; border-right:3px solid var(--dim); box-shadow:3px 0 0 #0a0916; z-index:20; }
        .logo-container { padding:1.4rem 1.2rem; text-align:center; border-bottom:2px solid var(--dim); }
        .logo { font-size:13px; color:var(--coral); display:inline-flex; align-items:center; gap:8px; }
        .logo-icon { width:18px; height:18px; background:var(--coral); box-shadow:var(--shadow-s); animation:pixelFloat 2.8s ease-in-out infinite; }
        .nav { display:flex; flex-direction:column; gap:4px; padding:1rem 0.6rem; flex-grow:1; }
        .nav-link { font-size:10px; color:var(--text2); text-decoration:none; padding:10px 12px; border:2px solid transparent; display:flex; align-items:center; gap:8px; }
        .nav-link:hover { background:var(--panel2); color:var(--teal); border-color:#266b5c; transform:translate(-2px,0); }
        .nav-link.active { background:var(--panel2); color:var(--coral); border-color:var(--coral); box-shadow:var(--shadow-s); }
        .nav-link.active::before { content:'▶'; font-size:8px; color:var(--coral); }
        .user-card { padding:1rem; border-top:2px solid var(--dim); display:flex; align-items:center; justify-content:space-between; gap:8px; }
        .avatar { width:30px; height:30px; background:var(--sky); display:flex; align-items:center; justify-content:center; font-size:12px; border:2px solid var(--dim); flex-shrink:0; color:var(--bg); }
        .user-name { font-size:9px; color:var(--dim2); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

        .main-content { margin-left:250px; flex-grow:1; padding:1.8rem; display:flex; flex-direction:column; gap:1.6rem; max-width:920px; }
        .topbar { display:flex; justify-content:flex-start; align-items:center; gap:16px; animation:fadeSlideUp 0.3s ease-out; }
        .topbar h1 { font-size:16px; color:var(--white); }

        .px-btn { font-family:'Press Start 2P',monospace; font-size:10px; padding:10px 16px; border:2px solid var(--white); cursor:pointer; text-transform:uppercase; text-decoration:none; display:inline-block; letter-spacing:0.04em; box-shadow:var(--shadow); }
        .px-btn:hover  { transform:translate(2px,2px); box-shadow:var(--shadow-s); }
        .px-btn:active { transform:translate(4px,4px); box-shadow:none; }
        .btn-coral { background:var(--coral); color:var(--bg); }
        .btn-dark  { background:var(--panel2); color:var(--text2); border-color:var(--dim); box-shadow:var(--shadow-s); }
        .btn-full  { width:100%; text-align:center; }

        .px-panel { background:var(--panel); border:2px solid var(--dim); box-shadow:var(--shadow); padding:2.2rem; position:relative; animation:fadeSlideUp 0.35s ease-out 0.1s both; }
        .px-panel::before { content:''; position:absolute; top:0; left:0; right:0; height:4px; background:var(--coral); }

        .form-group { margin-bottom:1.6rem; }
        .form-label { display:block; margin-bottom:0.6rem; color:var(--dim2); text-transform:uppercase; letter-spacing:0.05em; font-size:9px; }
        .px-input { width:100%; padding:10px 12px; background:var(--bg2); border:2px solid var(--dim); color:var(--text); font-family:'Press Start 2P',monospace; font-size:10px; outline:none; box-shadow:var(--shadow-s); }
        .px-input:focus { border-color:var(--teal); }
        .px-input::placeholder { color:var(--dim2); }

        .flash-messages { margin-bottom:1rem; }
        .flash-msg { padding:1rem 1.2rem; margin-bottom:0.5rem; border:2px solid var(--dim); font-size:9px; box-shadow:var(--shadow); line-height:1.8; animation:fadeSlideUp 0.2s ease-out; }
        .flash-success { background:var(--panel2); border-color:var(--mint); color:var(--mint); }
        .flash-error   { background:var(--panel2); border-color:var(--rose); color:var(--rose); }

        @media (max-width: 768px) { .sidebar { transform: translateX(-100%); } .main-content { margin-left: 0; } }
    </style>
</head>
<body>
    <div class="layout">
        <aside class="sidebar">
            <div class="logo-container"><div class="logo"><div class="logo-icon"></div>FAIRSHARE</div></div>
            <nav class="nav">
                <a href="{{ url_for('home') }}" class="nav-link">&gt; DASHBOARD</a>
                <a href="{{ url_for('create') }}" class="nav-link active">&gt; NEW PROJECT</a>
            </nav>
            <div class="user-card">
                <div class="avatar">{{ user_name[0]|upper if user_name else 'U' }}</div>
                <div class="user-name">{{ user_name }}</div>
                <form action="{{ url_for('logout') }}" method="GET">
                    <button type="submit" class="px-btn btn-dark" style="padding:6px 10px;font-size:9px;">OUT</button>
                </form>
            </div>
        </aside>

        <main class="main-content">
            <header class="topbar">
                <a href="{{ url_for('home') }}" class="px-btn btn-dark">BACK</a>
                <h1>NEW PROJECT</h1>
            </header>

            <div class="flash-messages">
                {% with messages = get_flashed_messages(with_categories=true) %}
                    {% if messages %}{% for category, message in messages %}
                        <div class="flash-msg flash-{{ category }}">{{ message }}</div>
                    {% endfor %}{% endif %}
                {% endwith %}
            </div>

            <section class="px-panel">
                <form id="project-form" action="{{ url_for('create') }}" method="POST">
                    <div class="form-group">
                        <label class="form-label" for="project_name">Project Name</label>
                        <input type="text" id="project_name" name="project_name" class="px-input" required maxlength="80" placeholder="E.g. Web Redesign">
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="deadline">Deadline</label>
                        <input type="date" id="deadline" name="deadline" class="px-input" required>
                    </div>
                    <button type="submit" class="px-btn btn-coral btn-full" style="margin-top:1rem;font-size:11px;">CREATE PROJECT</button>
                </form>
            </section>
        </main>
    </div>
    <script>
        document.getElementById('deadline').setAttribute('min', new Date().toISOString().split('T')[0]);
        document.getElementById('project-form').addEventListener('submit', () => {
            const btn = document.querySelector('#project-form button[type="submit"]');
            btn.textContent = 'CREATING...'; btn.style.pointerEvents = 'none'; btn.style.opacity = '0.6';
        });
    </script>
</body>
</html>
